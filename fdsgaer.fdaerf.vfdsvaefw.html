<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PALDIEMTK</title>
    <!-- Required CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2/src/md5.min.js"></script>
    <style>
        /* ============================================================
           THEME: Soft Gradient with Glassmorphism (inspired by reference)
           Fixed style: gradient backgrounds, frosted glass cards,
           soft shadows, vibrant warm/cool accents.
           ============================================================ */
        :root {
            --app-bg: #f5f7fb;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.4);
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --accent-up: #f97316;
            --accent-down: #3b82f6;
            --accent-blue: #6366f1;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --tab-height: 68px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--app-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* Soft gradient mesh background */
        .app-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 10% 20%, rgba(167, 243, 208, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 90% 10%, rgba(253, 186, 116, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(196, 181, 253, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(147, 197, 253, 0.3) 0%, transparent 50%);
            background-color: #f5f7fb;
        }

        /* Glass card utility */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
        }

        /* App container */
        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
        }

        .page-view {
            flex: 1;
            padding: 16px;
            padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 16px);
        }

        /* ===== Tab Bar ===== */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--tab-height);
            padding-bottom: var(--safe-bottom);
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            padding: 8px 16px;
            min-width: 64px;
            min-height: 44px;
            transition: color var(--transition);
            position: relative;
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            transition: stroke var(--transition), transform var(--transition);
        }

        .tab-item.router-link-active {
            color: var(--accent-blue);
        }

        .tab-item.router-link-active svg {
            transform: translateY(-1px);
        }

        /* ===== Page Transition ===== */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .fade-enter-from {
            opacity: 0;
            transform: translateY(12px);
        }
        .fade-leave-to {
            opacity: 0;
            transform: translateY(-12px);
        }

        /* ===== Loading Page ===== */
        .loading-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px;
        }
        .loading-logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 24px;
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.3);
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .loading-text {
            font-size: 15px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .loading-dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* ===== Home Page ===== */
        .home-header {
            padding: 8px 0 20px;
        }
        .home-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1a1a2e, #4a4a6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-tagline {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Market Card (inspired by reference) */
        .market-card {
            background: linear-gradient(135deg, rgba(167, 243, 208, 0.6), rgba(253, 186, 116, 0.5), rgba(196, 181, 253, 0.5));
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-height: 140px;
        }
        .market-card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .market-card-chart {
            width: 100%;
            height: 70px;
        }
        .market-card-chart svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Icon Grid */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .icon-grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 6px;
            border-radius: var(--radius-md);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: var(--glass-shadow);
            text-decoration: none;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            min-height: 80px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .icon-grid-item:active {
            transform: scale(0.95);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .icon-grid-item svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.6;
        }

        /* Stock List */
        .stock-list-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            box-shadow: var(--glass-shadow);
            padding: 16px;
            overflow: hidden;
        }
        .stock-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .stock-list-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stock-list-more {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }
        .stock-item {
            display: flex;
            align-items: center;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease;
            min-height: 56px;
        }
        .stock-item:last-child {
            border-bottom: none;
        }
        .stock-item:active {
            background: rgba(0, 0, 0, 0.02);
        }
        .stock-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .stock-info {
            flex: 1;
            min-width: 0;
        }
        .stock-symbol {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .stock-name {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stock-price-info {
            text-align: right;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .stock-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .stock-change {
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 2px;
        }
        .stock-change.up {
            color: var(--accent-up);
            background: rgba(249, 115, 22, 0.1);
        }
        .stock-change.down {
            color: var(--accent-down);
            background: rgba(59, 130, 246, 0.1);
        }
        .stock-item-progress {
            width: 48px;
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 0, 0, 0.06);
            margin-top: 4px;
            overflow: hidden;
        }
        .stock-item-progress-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* ===== Sub Page Common ===== */
        .sub-page {
            padding: 16px;
            padding-bottom: calc(var(--safe-bottom) + 24px);
        }
        .sub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-top: 4px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            box-shadow: var(--glass-shadow);
            flex-shrink: 0;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .sub-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Detail page */
        .detail-price {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 8px 0;
        }
        .detail-change {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .detail-change.up { color: var(--accent-up); }
        .detail-change.down { color: var(--accent-down); }
        .chart-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
        }
        .chart-container svg {
            width: 100%;
            height: 200px;
            display: block;
        }

        /* Article content */
        .article-content {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--glass-shadow);
            line-height: 1.7;
            font-size: 15px;
            color: var(--text-primary);
        }
        .article-content h3 {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .article-content p {
            margin-bottom: 12px;
            color: #333;
        }

        /* ===== Toolbox Page ===== */
        .toolbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .tool-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 20px 16px;
            box-shadow: var(--glass-shadow);
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            min-height: 100px;
            transition: transform 0.2s ease;
        }
        .tool-card:active {
            transform: scale(0.97);
        }
        .tool-card svg {
            width: 32px;
            height: 32px;
            stroke-width: 1.6;
        }
        .tool-card-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
        }
        .tool-card-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Tool inner page */
        .tool-form {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease;
            min-height: 44px;
        }
        .form-input:focus {
            border-color: var(--accent-blue);
        }
        .form-result {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
        }
        .result-row .label {
            color: var(--text-secondary);
        }
        .result-row .value {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ===== Settings Page ===== */
        .settings-list {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            margin-bottom: 16px;
        }
        .settings-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            min-height: 52px;
            transition: background 0.15s ease;
        }
        .settings-item:last-child {
            border-bottom: none;
        }
        .settings-item:active {
            background: rgba(0, 0, 0, 0.02);
        }
        .settings-item svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 1.8;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .settings-item-text {
            flex: 1;
        }
        .settings-item-arrow {
            color: var(--text-secondary);
            font-size: 18px;
            opacity: 0.5;
        }

        /* Check-in calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 12px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.4);
            min-height: 36px;
        }
        .calendar-day.empty {
            background: transparent;
        }
        .calendar-day.checked {
            background: var(--accent-blue);
            color: white;
        }
        .calendar-day.today {
            border: 2px solid var(--accent-blue);
        }
        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Feedback */
        .feedback-form {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--glass-shadow);
        }
        .feedback-form textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: var(--accent-blue);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            min-height: 48px;
            transition: opacity 0.2s ease, transform 0.15s ease;
            margin-top: 8px;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-primary:not(:disabled):active {
            transform: scale(0.97);
        }

        /* Inbox modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .modal-content p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-close {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--app-bg);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(var(--tab-height) + var(--safe-bottom) + 20px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            z-index: 300;
            white-space: nowrap;
            animation: toastIn 0.3s ease;
            pointer-events: none;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Misc */
        .text-center { text-align: center; }
        .mt-16 { margin-top: 16px; }
        .mb-16 { margin-bottom: 16px; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            padding-left: 4px;
        }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>

                        const chartWidth = 300;
                        const chartHeight = 200;
                        const padding = 20;

                        const min = Math.min(...history);
                        const max = Math.max(...history);
                        const range = max - min || 1;
                        const paddedMin = min - range * 0.1;
                        const paddedMax = max + range * 0.1;

                            const y = chartHeight - padding - ((p - paddedMin) / (paddedMax - paddedMin)) * (chartHeight - padding * 2);

                        });

                },

            },

                            if (s === 'Weak') return '#ef4444';
                            if (s === 'Medium') return '#f59e0b';
                            return '#10b981';
                        });
                        return { password, md5Digest, strengthLabel, strengthColor };
                    }
                },
                meta: { hideTab: true }
            },
            {
                path: '/tool/credit',
                name: 'CreditMemo',
                component: {
                    template: `
                        <div class="sub-page">
                            <div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">Credit Memo</div></div>
                            <div class="tool-form">
                                <div class="form-group"><label>Creditor Name</label><input v-model="creditor" class="form-input" placeholder="e.g. John" /></div>
                                <div class="form-group"><label>Amount</label><input v-model.number="amount" class="form-input" type="number" /></div>
                                <div class="form-group"><label>Due Date</label><input v-model="dueDate" class="form-input" type="date" /></div>
                                <div class="form-result" v-if="creditor && amount && dueDate">
                                    <div class="result-row"><span class="label">Days Remaining</span><span class="value">{{ daysLeft }}</span></div>
                                </div>
                            </div>
                        </div>
                    `,
                    setup() {
                        const creditor = ref('');
                        const amount = ref(1000);
                        const dueDate = ref('');
                        const daysLeft = computed(() => {
                            if (!dueDate.value) return '—';
                            const diff = new Date(dueDate.value) - new Date();
                            return Math.ceil(diff / (1000 * 60 * 60 * 24));
                        });
                        return { creditor, amount, dueDate, daysLeft };
                    }
                },
                meta: { hideTab: true }
            },
            // Settings sub-pages
            {
                path: '/privacy',
                name: 'Privacy',
                component: {
                    template: `<div class="sub-page"><div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">Privacy Policy</div></div><div class="article-content"><h3>Privacy Policy</h3><p>Your privacy is important to us. PALDIEMTK does not collect or share personal information without your consent. All data processing is performed locally on your device.</p><p>We may use anonymous device fingerprints for security purposes. No personal data is transmitted to external servers except as required for app functionality.</p></div></div>`,
                    setup() { return {}; }
                },
                meta: { hideTab: true }
            },
            {
                path: '/terms',
                name: 'Terms',
                component: {
                    template: `<div class="sub-page"><div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">Terms of Service</div></div><div class="article-content"><h3>Terms of Service</h3><p>By using PALDIEMTK, you agree to use the app for lawful purposes only. The information provided is for educational purposes and should not be considered financial advice.</p><p>We reserve the right to update these terms at any time. Continued use constitutes acceptance of any changes.</p></div></div>`,
                    setup() { return {}; }
                },
                meta: { hideTab: true }
            },
            {
                path: '/team',
                name: 'Team',
                component: {
                    template: `<div class="sub-page"><div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">About Team</div></div><div class="article-content"><h3>About Us</h3><p>We are a team of financial technology enthusiasts dedicated to making market data and tools accessible to everyone. Our mission is to empower individual investors with intuitive, privacy-focused solutions.</p><p>Built with a focus on simplicity and performance, PALDIEMTK is designed to help you make informed decisions.</p></div></div>`,
                    setup() { return {}; }
                },
                meta: { hideTab: true }
            },
            {
                path: '/checkin',
                name: 'Checkin',
                component: {
                    template: `
                        <div class="sub-page">
                            <div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">Check-in</div></div>
                            <div class="glass-card" style="padding: 20px;">
                                <div class="section-title">Monthly Check-in</div>
                                <div class="calendar-header">
                                    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                                </div>
                                <div class="calendar-grid">
                                    <div v-for="day in calendarDays" :key="day.key" class="calendar-day" :class="{ empty: !day.day, checked: day.checked, today: day.today }">
                                        {{ day.day }}
                                    </div>
                                </div>
                                <button class="btn-primary" @click="checkIn">Check In Today</button>
                            </div>
                        </div>
                    `,
                    setup() {
                        const today = new Date();
                        const year = today.getFullYear();
                        const month = today.getMonth();
                        const firstDay = new Date(year, month, 1).getDay();
                        const daysInMonth = new Date(year, month + 1, 0).getDate();
                        const checkedDays = ref(JSON.parse(localStorage.getItem('checkin_' + year + '_' + month) || '[]'));
                        const calendarDays = [];
                        for (let i = 0; i < firstDay; i++) {
                            calendarDays.push({ key: 'empty_' + i, day: null });
                        }
                        for (let d = 1; d <= daysInMonth; d++) {
                            const key = year + '-' + (month + 1) + '-' + d;
                            calendarDays.push({
                                key,
                                day: d,
                                checked: checkedDays.value.includes(d),
                                today: d === today.getDate()
                            });
                        }
                        function checkIn() {
                            const d = today.getDate();
                            if (!checkedDays.value.includes(d)) {
                                checkedDays.value.push(d);
                                localStorage.setItem('checkin_' + year + '_' + month, JSON.stringify(checkedDays.value));
                                // Re-render
                                calendarDays.forEach(c => {
                                    if (c.day === d) c.checked = true;
                                });
                            }
                            const el = document.createElement('div');
                            el.className = 'toast';
                            el.textContent = 'Check-in successful!';
                            document.body.appendChild(el);
                            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2000);
                        }
                        return { calendarDays, checkIn };
                    }
                },
                meta: { hideTab: true }
            },
            {
                path: '/feedback',
                name: 'Feedback',
                component: {
                    template: `
                        <div class="sub-page">
                            <div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">Feedback</div></div>
                            <div class="feedback-form">
                                <div class="form-group"><label>Title</label><input v-model="title" class="form-input" placeholder="Enter title" /></div>
                                <div class="form-group"><label>Content</label><textarea v-model="content" class="form-input" placeholder="Describe your feedback..."></textarea></div>
                                <button class="btn-primary" :disabled="!title || !content" @click="sendFeedback">Send</button>
                            </div>
                        </div>
                    `,
                    setup() {
                        const title = ref('');
                        const content = ref('');
                        const router = useRouter();
                        function sendFeedback() {
                            const el = document.createElement('div');
                            el.className = 'toast';
                            el.textContent = 'Feedback sent successfully!';
                            document.body.appendChild(el);
                            setTimeout(() => {
                                el.style.opacity = '0';
                                setTimeout(() => el.remove(), 300);
                                router.back();
                            }, 1500);
                        }
                        return { title, content, sendFeedback };
                    }
                },
                meta: { hideTab: true }
            },
            {
                path: '/inbox',
                name: 'Inbox',
                component: {
                    template: `
                        <div class="sub-page">
                            <div class="sub-header"><div class="back-btn" @click="$router.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sub-title">Inbox</div></div>
                            <div class="settings-list">
                                <div v-for="msg in messages" :key="msg.id" class="settings-item" @click="openMessage(msg)">
                                    <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                    <span class="settings-item-text">{{ msg.title }}</span>
                                    <span class="settings-item-arrow">›</span>
                                </div>
                            </div>
                            <div v-if="selectedMessage" class="modal-overlay" @click.self="selectedMessage = null">
                                <div class="modal-content">
                                    <h3>{{ selectedMessage.title }}</h3>
                                    <p>{{ selectedMessage.content }}</p>
                                    <button class="modal-close" @click="selectedMessage = null">Close</button>
                                </div>
                            </div>
                        </div>
                    `,
                    setup() {
                        const messages = ref([
                            { id: 1, title: 'Welcome', content: 'Welcome to PALDIEMTK! Explore market data, use our financial tools, and stay informed with the latest insights. We are glad to have you on board.' }
                        ]);
                        const selectedMessage = ref(null);
                        function openMessage(msg) {
                            selectedMessage.value = msg;
                        }
                        return { messages, selectedMessage, openMessage };
                    }
                },
                meta: { hideTab: true }
            }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // ==================================================================
        // Main App Component
        // ==================================================================
        const App = {
            template: `
                <router-view v-slot="{ Component }">
                    <transition name="fade" mode="out-in">
                        <component :is="Component" />
                    </transition>
                </router-view>
                <nav class="tab-bar" v-if="showTabBar">
                    <router-link to="/home" class="tab-item">
                        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        <span>Home</span>
                    </router-link>
                    <router-link to="/toolbox" class="tab-item">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        <span>Toolbox</span>
                    </router-link>
                    <router-link to="/settings" class="tab-item">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        <span>Settings</span>
                    </router-link>
                </nav>
            `,
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    return route.meta.showTab === true;
                });
                return { showTabBar };
            }
        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
